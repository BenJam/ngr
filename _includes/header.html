<header class="site-header">
  <div class="wrap site-header__inner">
    <a class="wordmark" href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>
      {% if site.logo %}
        <img src="{{ site.logo | relative_url }}" alt="{{ site.title }}" class="wordmark__logo">
      {% else %}
        <span class="wordmark__badge" aria-hidden="true">NGR</span>
        <span class="wordmark__text">{{ site.title }}</span>
      {% endif %}
    </a>
    <nav class="site-nav" aria-label="Main">
      <ul role="list">
        {% for item in site.nav %}
        <li><a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a></li>
        {% endfor %}
      </ul>
    </nav>
  </div>
</header>
