title: No Good Racing
description: Bike racing, without the bullsh*t
lang: en-GB
url: https://nogoodracing.cc
# Team logo, shown in the header (replaces the text wordmark)
logo: /assets/images/logo-alt.svg

# Our theme lives in this repo; stop github-pages applying its default (Primer)
theme: null

plugins:
  - jekyll-seo-tag

# Header + footer navigation
nav:
  - title: About
    url: /about/
  - title: Rides
    url: /rides/
  - title: Team
    url: /team/
  - title: Join
    url: /join/
  - title: Sponsors
    url: /sponsors/

exclude:
  - vendor
  - Gemfile
  - Gemfile.lock
  - README.md
  - CLAUDE.md
